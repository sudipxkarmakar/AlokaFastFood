<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Operations Monitor — AutoBrix</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-container">
    <!-- Top Header Bar -->
    <header style="padding: 10px 14px; background: rgba(15, 19, 30, 0.95); border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center;">
      <div class="logo-section" style="display: flex; align-items: center; gap: 8px;">
        <div class="logo-icon" style="width: 32px; height: 32px; background: #5850ec; color: #fff; font-weight: 800; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">A</div>
        <h1 class="logo-text" style="font-size: 1.1rem; font-weight: 800; color: #fff; margin: 0; letter-spacing: -0.02em;">AutoBrix</h1>
        <span style="font-size:0.65rem; font-weight:700; color:var(--text-muted); background:rgba(255,255,255,0.06); padding:2px 6px; border-radius:4px; font-family:var(--font-mono);">v1.0.0</span>
      </div>

      <div class="nav-controls" style="display: flex; align-items: center; gap: 10px;">
        <div id="db-status-badge"></div>
        <button class="theme-btn" id="theme-toggle" title="Toggle Theme" style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
      </div>
    </header>

    <main style="padding-bottom: 70px;">
      <div id="single-ops" style="height:100%;">
        <div class="ops-grid">
          <!-- Left Panel: Status Feed & KPIs -->
          <div class="ops-sidebar">
            <div class="ops-summary-mini">
              <div class="ops-mini-stat glass-card">
                <span class="form-label-xs">Active Alerts</span>
                <span class="ops-mini-val" id="ops-alert-count" style="color:var(--color-critical);">0</span>
              </div>
              <div class="ops-mini-stat glass-card">
                <span class="form-label-xs">Total Active Orders</span>
                <span class="ops-mini-val" id="ops-active-count">0</span>
              </div>
              <div class="ops-mini-stat glass-card">
                <span class="form-label-xs">Staff Checked-In</span>
                <span class="ops-mini-val" id="ops-staff-count" style="color:var(--color-success);">0</span>
              </div>
            </div>
            
            <div class="glass-card" style="flex-grow:1; display:flex; flex-direction:column; overflow:hidden;">
              <h4 class="modal-section-title" style="margin-bottom:0.75rem;">Live Alerts Feed</h4>
              <div class="ops-live-alerts-list" id="ops-alerts-list"></div>
            </div>
          </div>
          
          <!-- Right Panel: Grid of Station Timelines & Active Orders -->
          <div class="ops-main-panel">
            <!-- Station Workload Vis -->
            <div class="glass-card">
              <h4 class="modal-section-title" style="margin-bottom:0.75rem;">Kitchen Station Occupancy</h4>
              <div class="station-ops-grid" id="ops-stations-grid"></div>
            </div>
            
            <!-- Live Active Orders List -->
            <div class="glass-card" style="flex-grow:1;">
              <h4 class="modal-section-title" style="margin-bottom:0.75rem;">Live Orders Monitor</h4>
              <div class="owner-table-wrapper" style="border:none;">
                <table class="owner-table">
                  <thead>
                    <tr>
                      <th>Order #</th>
                      <th>Customer</th>
                      <th>Source</th>
                      <th>ETA</th>
                      <th>Fulfillment</th>
                      <th>Payment</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="ops-orders-list"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Fixed Bottom View Switcher Navigation Bar Across Pages -->
    <nav class="bottom-nav-bar">
      <a href="receptionist.html" class="bottom-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 10h18M3 14h18M5 6h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"></path></svg>
        <span>POS Cashier</span>
      </a>
      <a href="kitchen-a.html" class="bottom-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5c0 2 1.5 3.5 3 4.5V19a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2v-7.5c1.5-1 3-2.5 3-4.5a5 5 0 0 0-5-5z"></path></svg>
        <span>Kitchen A</span>
      </a>
      <a href="kitchen-b.html" class="bottom-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5c0 2 1.5 3.5 3 4.5V19a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2v-7.5c1.5-1 3-2.5 3-4.5a5 5 0 0 0-5-5z"></path></svg>
        <span>Kitchen B</span>
      </a>
      <a href="operations.html" class="bottom-nav-item active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
        <span>Operations</span>
      </a>
      <a href="owner.html" class="bottom-nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Owner Admin</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/store.js?v=3"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/operations.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.opsPanel = new AutoBrixOperations('single-ops');
    });
  </script>
</body>
</html>
